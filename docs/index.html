<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Progress Through Works</title>
  <meta name="description" content="An interactive 2D/3D diagram of a linked Obsidian second brain distilled from Works in Progress magazine: essays, the mechanisms they argue for, and the fields they belong to.">
  <meta name="author" content="Sarthak Mohanty">
  <meta property="og:title" content="Progress Through Works">
  <meta property="og:description" content="Essays from Works in Progress, the mechanisms they argue for, and the fields they belong to: an interactive 2D/3D second brain.">
  <meta property="og:image" content="https://profsarthak.github.io/wip-brain/preview.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <!-- The brand ◆: orange diamond on ink. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23161613'/%3E%3Cpolygon points='16,5 27,16 16,27 5,16' fill='%23e8531d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.180.0",
        "three/examples/jsm/": "https://esm.sh/three@0.180.0/examples/jsm/",
        "3d-force-graph": "https://esm.sh/3d-force-graph@1.80.1?deps=three@0.180.0"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="graph" aria-label="Interactive diagram of linked notes"></div>
  <div class="crop-frame" aria-hidden="true"></div>

  <header class="status">
    <div class="l">
      <a href="https://profsarthak.github.io/" class="mark"><span class="dot">◆</span><b>PROFSARTHAK</b></a>
      <span class="mut">/ WIP-BRAIN</span>
      <span class="mut wide" id="sb-counts"></span>
    </div>
    <div class="r">
      <span class="wide" id="sb-cam"></span>
      <span id="sb-time"></span>
    </div>
  </header>

  <div class="rail">
    <header class="brand">
      <div class="eyebrow">/01 — A map of <a href="https://worksinprogress.co" target="_blank" rel="noopener">Works in Progress</a></div>
      <h1>Progress Through Works<span class="dot">.</span></h1>
      <div class="stats" id="stats">&nbsp;</div>
    </header>

    <div class="search-row">
      <div class="search">
        <input id="q" type="search" placeholder="SEARCH NOTES" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list" aria-label="Search notes">
        <kbd>/</kbd>
        <ul id="results" class="results card" role="listbox" hidden></ul>
      </div>
      <button id="legend-toggle" class="btn icon" aria-expanded="false" aria-controls="legend" aria-label="Show index">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="3" height="3"/><rect x="3" y="13" width="3" height="3"/><path d="M9 5.5h8M9 14.5h8"/></svg>
      </button>
    </div>

    <aside id="legend" class="card tabbed" aria-label="Filters and domains">
      <div class="tab">◆ 02 — INDEX</div>
      <div class="types" id="types"></div>
      <ol id="domains"></ol>
      <p class="credit">Notes distilled from essays in <a href="https://worksinprogress.co" target="_blank" rel="noopener">Works in Progress</a>. Unofficial reader project; essays © their authors. <span id="updated"></span></p>
    </aside>
  </div>

  <div class="view">
    <div class="seg" id="view" role="group" aria-label="View">
      <button data-mode="2d" aria-pressed="true">2D</button>
      <button data-mode="3d" aria-pressed="false">3D</button>
    </div>
    <div class="seg" id="colour" role="group" aria-label="Colour">
      <button data-colour="ink" aria-pressed="true">INK</button>
      <button data-colour="fields" aria-pressed="false">FIELDS</button>
    </div>
    <button id="fit" class="btn icon" aria-label="Fit whole diagram in view" title="Fit to view">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg>
    </button>
  </div>

  <aside id="panel" class="card tabbed" aria-live="polite" inert></aside>

  <div class="timeline card">
    <button id="play" class="play" aria-label="Play the brain growing issue by issue">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path class="i-play" d="M6 4v12l10-6z"/><path class="i-pause" d="M5 4h3.5v12H5zM11.5 4H15v12h-3.5z"/></svg>
    </button>
    <div class="tl-body">
      <div class="tl-head">
        <span class="eyebrow">/04 — Timeline</span>
        <output id="tl-label" for="issue"></output>
      </div>
      <label class="tl-track">
        <span class="sr-only">Show notes up to issue</span>
        <input id="issue" type="range" min="1" step="1">
      </label>
      <div class="ticks" id="ticks" aria-hidden="true"></div>
    </div>
  </div>

  <div id="loading"><span>◆ LOADING GRAPH<i class="caret"></i></span></div>
</body>
</html>
